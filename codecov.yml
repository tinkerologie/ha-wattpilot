# Codecov configuration
# Reference: https://docs.codecov.com/docs/codecov-yaml

codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        # At least 90% of added or changed lines must be covered by tests.
        target: 90%
        threshold: 0%
        informational: false

flags:
  python:
    paths:
      - custom_components/wattpilot/
      - scripts/
    carryforward: true
  frontend:
    paths:
      - frontend/src/
    carryforward: true

ignore:
  - "custom_components/wattpilot/frontend/**"
  - "frontend/test/**"

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: false
