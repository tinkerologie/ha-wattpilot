set_next_trip:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            integration: wattpilot
    trigger_time:
      required: true
      example: "06:30:00"
      selector:
        time:

set_goe_cloud:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            integration: wattpilot
    cloud_api:
      required: true
      example: false
      selector:
        boolean:

disconnect_charger:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            integration: wattpilot

reconnect_charger:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            integration: wattpilot

set_charging_schedule:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            integration: wattpilot
    schedule:
      required: true
      default: all
      example: all
      selector:
        select:
          options:
            - weekday
            - saturday
            - sunday
            - weekend
            - all
    control:
      required: false
      example: Allow Charging + PV Surplus
      selector:
        select:
          options:
            - Disabled
            - Allow Charging
            - Block Charging
            - Allow Charging + PV Surplus
            - Block Charging + PV Surplus
    start_time_1:
      required: false
      example: "23:00:00"
      selector:
        time:
    end_time_1:
      required: false
      example: "15:00:00"
      selector:
        time:
    start_time_2:
      required: false
      example: "00:00:00"
      selector:
        time:
    end_time_2:
      required: false
      example: "00:00:00"
      selector:
        time:
