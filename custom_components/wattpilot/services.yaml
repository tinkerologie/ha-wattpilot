set_next_trip:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            integration: wattpilot
    trigger_time:
      required: true
      example: "06:30:00"
      selector:
        time:

set_goe_cloud:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            integration: wattpilot
    cloud_api:
      required: true
      example: false
      selector:
        boolean:

disconnect_charger:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            integration: wattpilot

reconnect_charger:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            integration: wattpilot
