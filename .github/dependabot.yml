# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for more information:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://containers.dev/guide/dependabot

version: 2
updates:
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      devcontainers-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      pip-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # pytest and pytest-asyncio are pinned (==) by pytest-homeassistant-custom-component.
      # Letting Dependabot raise their floor independently produces an
      # unsatisfiable lock; it must track whatever pthcc allows.
      - dependency-name: pytest
      - dependency-name: pytest-asyncio

    allow:
      - dependency-type: all
    versioning-strategy: increase
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
