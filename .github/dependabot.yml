# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for more information:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://containers.dev/guide/dependabot

version: 2
updates:
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Australia/Brisbane
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      devcontainers-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  # uv: Dependabot updates uv.lock for version and security updates, and pyproject.toml
  # only when a constraint has to change.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
      timezone: Australia/Brisbane
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      homeassistant-test-harness:
        patterns:
          - homeassistant
          - pytest-homeassistant
      uv-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    # pytest-homeassistant pins these test runners exactly. Let its updates
    # move the runner pins together with the matching Home Assistant release.
    ignore:
      - dependency-name: pytest
      - dependency-name: pytest-asyncio
    allow:
      - dependency-type: all
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Australia/Brisbane
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
