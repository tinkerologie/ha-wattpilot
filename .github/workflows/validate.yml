name: Validate

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: 23 2 * * *
      timezone: Australia/Brisbane
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-version:
    name: Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check if manifest.json changed
        id: manifest_changed
        env:
          # Compare against the PR base, the previous push, or main for manual runs.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
        run: |
          if git diff --name-only "$BASE"...HEAD | grep -q "custom_components/wattpilot/manifest.json"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate version format
        if: steps.manifest_changed.outputs.changed == 'true'
        run: |
          VERSION=$(jq -r '.version' custom_components/wattpilot/manifest.json)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Invalid version format: $VERSION"
            echo "Version must be in format X.Y.Z (e.g., 0.3.8)"
            exit 1
          fi
          echo "✅ Valid version format: $VERSION"

      - name: Check changelog updated
        if: steps.manifest_changed.outputs.changed == 'true'
        run: |
          VERSION=$(jq -r '.version' custom_components/wattpilot/manifest.json)
          if ! grep -q "\[$VERSION\]" CHANGELOG.md; then
            echo "❌ CHANGELOG.md does not contain an entry for version $VERSION"
            echo "Please update CHANGELOG.md with release notes for this version"
            exit 1
          fi
          echo "✅ CHANGELOG.md contains entry for version $VERSION"

  hacs-validate:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: HACS Validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  quality-scale:
    name: Quality Scale
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install PyYAML
        run: python -m pip install --upgrade pip pyyaml

      - name: Validate quality_scale.yaml
        run: |
          python3 << 'EOF'
          import sys
          import yaml

          with open('custom_components/wattpilot/quality_scale.yaml', encoding='utf-8') as f:
              quality_scale = yaml.safe_load(f)

          if not isinstance(quality_scale, dict):
              print('❌ quality_scale.yaml must contain a mapping at the top level')
              sys.exit(1)

          tier = quality_scale.get('tier')
          rules = quality_scale.get('rules')

          if tier is None:
              print('❌ Missing tier in quality_scale.yaml')
              sys.exit(1)

          if rules is None:
              print('❌ Missing rules in quality_scale.yaml')
              sys.exit(1)

          print(f'✅ quality_scale.yaml valid - tier: {tier} - rules: {len(rules) if isinstance(rules, dict) else "present"}')
          EOF
